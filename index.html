t{background:#fff;color:#52617d;border:1px solid var(--line)}.full{width:100%;margin-top:16px}.pill{border-radius:6px;background:var(--soft);color:var(--accent);padding:5px 9px;font-size:13px;font-weight:700;display:inline-block}.switch{display:flex;gap:6px;background:#e8edf5;padding:4px;border-radius:10px}.switch button{padding:9px 14px;border-radius:7px;background:transparent;color:#64718a;font-size:14px}.switch button.active{background:#fff;color:#182647;box-shadow:0 1px 5px #18264715}.note{font-size:12px;color:#7b879d;margin-top:20px;line-height:1.7}.choices{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.choices button{padding:11px 14px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#52617d;font-size:14px;min-height:44px}.choices button.selected{background:var(--soft);border-color:var(--accent);color:var(--accent)}.label{display:block;color:#52617d;font-size:14px;margin-bottom:9px}select,input{width:100%;border:1px solid #ccd5e5;border-radius:9px;background:#fff;padding:13px;color:#182647}.step{display:flex;gap:12px;align-items:flex-start;border-top:1px solid var(--line);padding:16px 0}.step:first-child{border:0}.num{background:var(--soft);color:var(--accent);width:28px;height:28px;display:grid;place-items:center;flex-shrink:0;border-radius:50%;font-size:14px;font-weight:700}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:18px 10px;border-radius:12px;background:#f5f7fb}.stat b{display:block;font-size:26px;letter-spacing:-.03em;margin-bottom:6px}.stat small{font-size:12px}.map{width:100%;height:auto;display:block;border-radius:12px;background:#f5f7fb;margin:18px 0 8px}.map text{font-family:inherit;font-size:15px;fill:#52617d}.map .store{fill:white;stroke:#dce3ef;stroke-width:1.5}.map .target{fill:#eaf0ff;stroke:#2159df;stroke-width:2}.map .path{fill:none;stroke:#2159df;stroke-width:5;stroke-dasharray:8 8;stroke-linecap:round}.recommend{border-left:4px solid var(--accent);padding:18px;background:var(--soft);border-radius:0 12px 12px 0;margin:16px 0}.recmeta{display:flex;gap:12px;margin-top:10px;font-size:13px;color:#52617d}.barrow{display:grid;grid-template-columns:85px 1fr 48px;gap:12px;align-items:center;margin:16px 0;font-size:14px}.bar{height:9px;background:#e8edf5;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}.product{display:flex;gap:18px;align-items:center}.productmark{width:72px;height:90px;border:1px solid var(--line);display:grid;place-items:center;flex-shrink:0;border-radius:12px;font-size:14px;color:#64718a;background:#f2f5fa}.price{font-size:23px;font-weight:700;margin:8px 0}.location{padding:15px;border:1px solid var(--line);border-radius:12px;margin-top:15px}.success{padding:16px;border-radius:12px;background:#edf8f2;color:#246e4c;margin-top:16px}.progress{height:10px;background:#e5e9ef;border-radius:9px;overflow:hidden;margin:16px 0}.progress i{height:100%;display:block;background:var(--accent);border-radius:9px}.gold{--accent:#94651e;--soft:#fbf1da}.goldhero{background:#17233b;color:#fff;border:0;padding:30px}.goldhero .eyebrow{color:#e7c57c}.goldhero .muted{color:#b1bbce}.balance{font-size:54px;font-weight:600;letter-spacing:-.06em;margin:16px 0 4px}.balance span{font-size:24px;letter-spacing:0;color:#e7c57c}.goldhero .progress{background:#344159}.goldhero .progress i{background:#e7c57c}.ledger{border-top:1px solid var(--line);padding:15px 0}.sticky{position:fixed;bottom:0;left:0;right:0;background:#fffefc;border-top:1px solid var(--line);display:flex;justify-content:center;gap:30px;padding:12px 20px calc(12px + env(safe-area-inset-bottom));z-index:5}.sticky button{background:none;color:#64718a;font-size:14px;padding:8px}.sticky button.active{font-weight:700;color:var(--accent)}dialog{border:0;border-radius:18px;padding:28px;max-width:440px;width:calc(100% - 32px);box-shadow:0 20px 70px #0003;color:#182647}dialog::backdrop{background:#18264770}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#182647;color:#fff;padding:14px 20px;border-radius:12px;z-index:15;width:max-content;max-width:calc(100% - 32px);font-size:14px;box-shadow:0 8px 25px #0002}.hide{display:none!important}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:14px 8px;border-bottom:1px solid var(--line)}th{color:#64718a;font-weight:500}.gold .tabs button[aria-selected=true]{background:#17233b}
@media(max-width:720px){header{padding:16px}header strong{font-size:15px}.badge{font-size:11px}.tabs{margin-top:16px;padding:0 14px;gap:5px}.tabs button{padding:12px 6px;font-size:14px}.shell{padding:22px 16px 105px}.titleline{align-items:flex-start;flex-wrap:wrap;margin-bottom:20px}h1{font-size:25px}.grid{grid-template-columns:1fr;gap:0}.card{padding:20px;border-radius:15px}.stat b{font-size:23px}.balance{font-size:48px}.sticky{gap:18px}.switch button{padding:9px 12px}.map text{font-size:15px}.goldhero{padding:25px}}

.camera-panel{position:fixed;inset:0;z-index:30;background:#10233a;color:white;display:flex;flex-direction:column;padding:0;overflow:auto}.camera-panel[hidden]{display:none}.camera-stage{position:relative;flex:1;min-height:320px;background:#10233a;overflow:hidden}.camera-stage video{position:absolute;width:100%;height:100%;object-fit:cover;inset:0}.camera-top{position:absolute;top:0;left:0;right:0;padding:calc(16px + env(safe-area-inset-top)) 16px 16px;background:linear-gradient(#000b,transparent);display:flex;justify-content:space-between;gap:16px;align-items:flex-start;z-index:2}.camera-top p{font-size:14px;color:#e7eef9}.camera-close{background:#fff;color:#182647;border-radius:50%;width:48px;height:48px;font-size:25px;flex-shrink:0}.camera-guidance{position:absolute;inset:28% 0 10%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;pointer-events:none}.camera-arrow{width:145px;height:145px;filter:drop-shadow(0 4px 10px #0007)}.camera-caption{background:#10233ae6;padding:12px 18px;border:1px solid #ffffff55;border-radius:14px;text-align:center;font-size:20px;font-weight:700}.camera-status{position:absolute;bottom:18px;left:16px;right:16px;background:#10233ae6;border-radius:12px;padding:12px;font-size:14px;text-align:center}.camera-controls{padding:20px 16px calc(20px + env(safe-area-inset-bottom));background:#fff;color:#182647}.camera-controls p{font-size:14px;margin:8px 0}.camera-controls .row{align-items:stretch}.camera-controls .btn{flex:1}.camera-controls .note{margin-top:12px}.camera-panel .pill{background:#eaf0ff;color:#2159df}
.event-list{display:grid;gap:18px}.event-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.event-card img{display:block;width:100%;height:190px;object-fit:cover}.event-body{padding:18px}.event-body h3{margin-top:12px}.event-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.event-actions button{flex:1;min-width:125px}.recmeta{flex-wrap:wrap}</style><link rel="stylesheet" href="./lab.css"></head><body data-concept="quest">
<header><strong>Quest</strong><span class="badge">体験デモ</span></header>

<main id="app" class="shell" aria-label="Quest"></main><nav id="bottom" class="sticky" aria-label="画面切替"></nav><div class="toast hide" id="toast" role="status"></div>

<section id="cameraPanel" class="camera-panel" role="dialog" aria-modal="true" aria-label="カメラで案内" hidden><div class="camera-stage"><video id="cameraVideo" autoplay muted playsinline aria-label="カメラ映像"></video><div class="camera-top"><div><span class="pill">カメラ案内 · デモ</span><h2 id="cameraDestination" style="margin-top:12px"></h2><p>3F · 架空の経路</p></div><button class="camera-close" onclick="closeCamera()" aria-label="カメラを閉じる">×</button></div><div class="camera-guidance"><svg id="cameraArrow" class="camera-arrow" viewBox="0 0 100 100" role="img" aria-label="直進"><path d="M50 8L90 48H65V90H35V48H10Z" fill="#3c85ff" stroke="white" stroke-width="5" stroke-linejoin="round"/></svg><div id="cameraCaption" class="camera-caption" aria-live="polite">まっすぐ進む</div></div><p id="cameraStatus" class="camera-status" role="status">カメラへのアクセスを確認しています…</p></div><div class="camera-controls"><div class="row"><b id="cameraStep">案内 1 / 3</b><span class="muted">手動で経路を体験</span></div><div class="location"><b>取得した現在地</b><p id="cameraLocation" role="status"></p><button id="cameraGeoToggle" class="btn secondary full" onclick="toggleLocation()">位置情報を取得</button></div><p>現在地は端末から取得します。矢印と到着判定は、館内の位置・向きに連動しないデモです。</p><div class="row"><button id="cameraBack" class="btn ghost" onclick="advanceCamera(-1)">前の案内</button><button id="cameraNext" class="btn" onclick="advanceCamera(1)">次の案内</button></div><button id="cameraRetry" class="btn secondary full" onclick="startCamera()" hidden>カメラを再試行</button><p class="note">映像はこの画面の表示にだけ使い、録画・送信しません。</p></div></section>
<script>
const state={origin:'案内掲示板のQR',app:'quest',view:'home',destination:'Apple',minutes:null,theme:'all',selectedEvent:null,arrived:false,detour:false,reason:'サイズが不安',saved:false,nearby:false,tried:false,fit:'ちょうどいい',ordered:false,points:12400,gold:.82,converted:0,exchanged:false};
const $=id=>document.getElementById(id);let timer;
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hide');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.add('hide'),3200)}
function view(v){state.view=v;render();window.scrollTo({top:0,behavior:'smooth'})}
function bottom(items){$('bottom').innerHTML=items.map(([v,t])=>`<button class="${state.view===v?'active':''}" onclick="view('${v}')">${t}</button>`).join('')}
function title(brand,title,extra=''){return `<div class="titleline"><div><p class="eyebrow">${brand}</p><h1>${title}</h1></div>${extra}</div>`}
function render(){document.body.classList.toggle('gold',state.app==='gold');$('app').innerHTML=quest();updateLocationUI();bottom(state.app==='quest'?[['home','館内マップ'],['insight','店舗の価値']]:state.app==='ec'?[['home','商品'],['saved','惜しいリスト'],['visit','店舗で確認']]:[['home','金を貯める'],['reward','現物に交換'],['history','履歴']]);}
const places={Apple:[112,80], '無印良品':[350,80], 'トイレ':[112,255], 'カフェ':[350,255], 'イベント':[112,255], 'ファッション':[350,80], '出口':[270,310]};
const events=[{id:'anime',name:'星の旅人 ポップアップストア',theme:'event',floor:'3F',walk:2,stay:5,place:'イベント',image:'anime.webp',desc:'オリジナル作品の展示と限定グッズ。',time:'本日 18:00まで'}, {id:'fashion',name:'CITY THREADS 新作コレクション',theme:'fashion',floor:'3F',walk:2,stay:5,place:'ファッション',image:'fashion.webp',desc:'お気に入りの一着を、実物でチェック。',time:'本日 20:00まで'}, {id:'craft',name:'暮らしのクラフトマーケット',theme:'event',floor:'3F',walk:3,stay:12,place:'イベント',image:'craft.webp',desc:'器や手仕事の雑貨に出会う期間限定企画。',time:'本日 17:00まで'}];
function activeTarget(){return state.detour&&state.selectedEvent?events.find(e=>e.id===state.selectedEvent).place:state.destination}
function map(){const target=activeTarget();const end=places[target]||places.Apple;const start=state.arrived?(places[state.destination]||places.Apple):[270,310];return `<svg class="map" viewBox="0 0 540 350" role="img" aria-label="架空の3階フロア。${target}への経路"><rect x="18" y="18" width="504" height="314" rx="15" fill="#edf1f7"/>${[['Apple',36,36],['無印良品',289,36],['トイレ',36,208],['カフェ',289,208]].map(([n,x,y])=>`<rect class="${target===n||(target==='ファッション'&&n==='無印良品')||(target==='イベント'&&n==='トイレ')?'target':'store'}" x="${x}" y="${y}" width="213" height="100" rx="9"/><text x="${x+20}" y="${y+40}">${n==='トイレ'?'トイレ / イベントエリア':n==='無印良品'?'無印良品 / ファッション':n}</text>`).join('')}<path class="path" d="M${start[0]} ${start[1]}L${start[0]} 170L${end[0]} 170L${end[0]} ${end[1]}"/><circle cx="${start[0]}" cy="${start[1]}" r="10" fill="#2159df" stroke="white" stroke-width="4"/><circle cx="${end[0]}" cy="${end[1]}" r="8" fill="#182647"/><text x="200" y="193">通路・エレベーター</text><text x="290" y="325">出口</text></svg>`}
function setTime(n){state.minutes=n;state.theme='all';render()}
function chooseEvent(id,camera=false){state.selectedEvent=id;state.detour=true;render();if(camera)openCamera();else toast('選んだ催事までの経路を地図に表示しました')}
function recommendations(){if(state.minutes===null)return `<p>用事が済んだら、今の時間に合わせて選べます。</p><div class="stack"><button class="btn" onclick="setTime(5)">5分だけ寄ってみる</button><button class="btn secondary" onclick="setTime(15)">15分くらい時間がある</button><button class="btn ghost" onclick="goExit()">今日は帰る · 出口へ</button></div>`;return `<div class="choices" aria-label="寄り道の時間">${[5,15].map(n=>`<button class="${state.minutes===n?'selected':''}" onclick="setTime(${n})">${n}分くらい</button>`).join('')}<button onclick="goExit()">今日は帰る</button></div><div class="choices" aria-label="興味のあるテーマ">${[['all','すべて'],['fashion','ファッション'],['event','作品・イベント']].map(([v,t])=>`<button class="${state.theme===v?'selected':''}" onclick="state.theme='${v}';render()">${t}</button>`).join('')}</div><div class="event-list">${events.filter(e=>(state.theme==='all'||state.theme===e.theme)&&e.stay<=state.minutes).map(e=>`<article class="event-card"><img src="assets/${e.image}" alt="${e.name}のイメージ" width="600" height="400"><div class="event-body"><span class="pill">${e.time} · デモ</span><h3>${e.name}</h3><p>${e.desc}</p><div class="recmeta"><span>${e.floor} · 徒歩${e.walk}分</span><span>滞在目安${e.stay}分</span></div><div class="event-actions"><button class="btn secondary" onclick="chooseEvent('${e.id}')">地図で案内</button><button class="btn" onclick="chooseEvent('${e.id}',true)">カメラで案内</button></div></div></article>`).join('')}</div><p class="note">催事名・開催時間・フロアは架空の体験例。画像はオリジナルのイメージです。時間は滞在目安です。</p>`}
function goExit(){state.destination='出口';state.arrived=false;state.detour=false;state.selectedEvent=null;state.minutes=null;render();toast('出口への経路を表示しました')}
function quest(){if(state.view==='insight')return title('QUEST / STORE INSIGHTS','売上以外の価値を見る','<span class="pill">集計例</span>')+`<div class="grid"><section><div class="card"><div class="row"><h2>無印良品</h2><span class="muted">直近30日</span></div><div class="statgrid"><div class="stat"><b>2,480</b><small>目的地として選択</small></div><div class="stat"><b>31%</b><small>到着後の寄り道率</small></div><div class="stat"><b>8.4 km</b><small>来館者の居住地距離・中央値</small></div></div><h3 style="margin-top:25px">この店を目当てに来た人の寄り道先</h3><div class="barrow"><span>カフェ</span><div class="bar"><i style="width:78%"></i></div><b>38%</b></div><div class="barrow"><span>イベント</span><div class="bar"><i style="width:60%"></i></div><b>29%</b></div><div class="barrow"><span>生活雑貨</span><div class="bar"><i style="width:45%"></i></div><b>22%</b></div><p class="note">寄り道先の割合は寄り道した来館者の集計例。距離は同意のある地域情報から算出する想定です。</p></div><div class="card"><h2>送客のつながり</h2><table><thead><tr><th>出発店舗</th><th>次の目的地</th><th>送客数</th></tr></thead><tbody><tr><td>無印良品</td><td>カフェ</td><td>292人</td></tr><tr><td>無印良品</td><td>イベント</td><td>223人</td></tr><tr><td>カフェ</td><td>生活雑貨</td><td>108人</td></tr></tbody></table></div></section><aside><div class="card"><h2>店舗継続・配置の検討材料</h2><p>この店に来るために来館し、その後ほかの店にも足を運んでいる。</p><div class="recommend"><h3>館全体への貢献</h3><p>目的地としての吸引力と、到着後の送客力を一緒に確認できます。</p></div><p class="muted">売上・賃料・客層などと合わせて判断します。</p><button class="btn secondary full" onclick="view('home')">来館者の画面を見る</button></div></aside></div><p class="note">店舗名は体験イメージ。数値はすべて架空のサンプルです。</p>`;
return title('QUEST','今日は、どこへ？','<span class="pill">デモ館 · 3F</span>')+`<div class="grid"><section><div class="card"><label class="label" for="origin">案内を開いた場所（デモ）</label><select id="origin" onchange="state.origin=this.value;ConceptLab.track('journey_start',{origin:this.value,destination:state.destination})">${['案内掲示板のQR','トイレ付近のQR','アプリから直接'].map(o=>`<option ${state.origin===o?'selected':''}>${o}</option>`).join('')}</select><label class="label" for="destination">最初に行きたい場所</label><select id="destination" onchange="state.destination=this.value;state.arrived=false;state.detour=false;state.minutes=null;state.selectedEvent=null;render()">${['Apple','無印良品','トイレ','カフェ','イベント','出口'].map(s=>`<option ${state.destination===s?'selected':''}>${s}</option>`).join('')}</select>${map()}${locationPanel()}<button id="cameraLaunch" class="btn secondary full" onclick="openCamera()">カメラで案内</button><div class="row"><div><b>${state.arrived?'目的フロアへ到着':state.destination+'まで'}</b><p class="muted">${state.arrived?'お買い物のあとは、気になる場所へ。':'同じフロア · 約2分'}</p></div><span class="pill">3F</span></div><button class="btn full" onclick="state.arrived=true;render();toast('用事が済んだら、寄り道を選べます')" ${state.arrived?'disabled':''}>${state.arrived?'目的フロアに到着済み':'到着を体験する'}</button><p class="note">マップは架空のフロアです。取得した位置情報は別に表示します。フロアの位置・経路はデモです。</p></div></section><aside><div class="card"><h2>${state.arrived?'用事が済んだら、少し寄り道？':'目的のお店へ、まずご案内。'}</h2>${state.arrived?recommendations():`<p class="muted">到着したら、近くの店舗や時間限定のイベントを提案します。</p><div class="step"><span class="num">1</span><div><b>目当ての店を選ぶ</b><p class="muted">来館の目的から案内が始まります。</p></div></div><div class="step"><span class="num">2</span><div><b>到着後に、おすすめを見る</b><p class="muted">時間があれば、もう一か所。</p></div></div>`}</div><div class="card"><p class="eyebrow">STORE INSIGHTS</p><h3>この寄り道が、店舗の価値になる。</h3><p class="muted">目的地として選ばれた回数や、ほかの店への送客を可視化。</p><button class="btn secondary full" onclick="view('insight')">店舗の価値を見る</button></div></aside></div>`}

const geo={watchId:null,generation:0,active:false,status:'位置情報はまだ取得していません。',position:null};
function locationPanel(){return `<div class="location"><h3>端末の現在地</h3><p id="locationStatus" role="status"></p><button id="geoToggle" class="btn secondary full" onclick="toggleLocation()">位置情報を取得</button><p class="muted">利用を許可すると、現在地と精度を更新します。位置情報はこの画面だけで使い、保存・送信しません。画面を離れると取得を停止します。</p><p class="muted">GPSだけでは館内の階や店舗位置を特定できないため、フロアマップと矢印はデモ表示です。</p></div>`;}
function locationText(){const p=geo.position;return geo.status+(p?`\n緯度 ${p.latitude.toFixed(5)} / 経度 ${p.longitude.toFixed(5)}\n精度の目安 ±${Math.round(p.accuracy)}m · ${new Date(p.timestamp).toLocaleTimeString('ja-JP')}取得`:'');}
function updateLocationUI(){for(const id of ['locationStatus','cameraLocation']){const el=$(id);if(el){el.textContent=locationText();el.style.whiteSpace='pre-line';el.style.overflowWrap='anywhere';}}for(const id of ['geoToggle','cameraGeoToggle']){const el=$(id);if(el)el.textContent=geo.active?'位置情報の取得を停止':'位置情報を取得';}}
function stopLocation(message='位置情報の取得を停止しました。'){geo.generation++;if(geo.watchId!==null){navigator.geolocation?.clearWatch(geo.watchId);geo.watchId=null;}geo.active=false;geo.position=null;geo.status=message;updateLocationUI();}
function toggleLocation(){if(geo.active){stopLocation();return;}startLocation();}
function startLocation(){
 if(geo.active)return;
 if(!navigator.geolocation){geo.status='このブラウザでは位置情報を利用できません。';updateLocationUI();return;}
 if(!window.isSecureContext){geo.status='位置情報を使うには、安全な接続でこのページを開いてください。';updateLocationUI();return;}
 geo.active=true;geo.position=null;geo.status='現在地を取得しています。位置情報の利用を許可してください。';const generation=++geo.generation;updateLocationUI();
 try{geo.watchId=navigator.geolocation.watchPosition(position=>{
  if(!geo.active||generation!==geo.generation)return;
  const {latitude,longitude,accuracy}=position.coords;
  if(!Number.isFinite(latitude)||!Number.isFinite(longitude)||!Number.isFinite(accuracy))return;
  geo.position={latitude,longitude,accuracy,timestamp:position.timestamp};geo.status=accuracy>50?'現在地を取得しました。精度が低いため、店舗への到着判定には使えません。':'現在地を更新中です。館内の階・店舗位置は未判定です。';updateLocationUI();
 },error=>{
  if(!geo.active||generation!==geo.generation)return;
  const message=error.code===1?'位置情報が許可されていません。ブラウザの設定で許可すると再試行できます。':error.code===2?'現在地を取得できませんでした。通信や端末の位置情報設定を確認して再試行してください。':'現在地の取得に時間がかかっています。場所を変えて再試行してください。';
  stopLocation(message);
 },{enableHighAccuracy:true,timeout:15000,maximumAge:5000});
 }catch(error){stopLocation('位置情報を開始できませんでした。ブラウザで開いて再試行してください。');}
}

let cameraStream=null,cameraRequest=0,cameraIndex=0,cameraOrigin=null,cameraTarget='',cameraSteps=[];
function stopCamera(){cameraRequest++;if(cameraStream){cameraStream.getTracks().forEach(track=>track.stop());cameraStream=null;}$('cameraVideo').srcObject=null;}
async function startCamera(){
 stopCamera();const request=cameraRequest;$('cameraRetry').hidden=true;$('cameraStatus').textContent='カメラへのアクセスを確認しています…';
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw {name:'Unavailable'};
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  if(request!==cameraRequest||$('cameraPanel').hidden){stream.getTracks().forEach(track=>track.stop());return;}
  cameraStream=stream;$('cameraVideo').srcObject=stream;await $('cameraVideo').play();
  if(request===cameraRequest&&!$('cameraPanel').hidden)$('cameraStatus').textContent='カメラ映像に案内を表示中 · 経路はデモ';
 }catch(error){
  if(request!==cameraRequest||$('cameraPanel').hidden)return;stopCamera();
  $('cameraStatus').textContent=error.name==='NotAllowedError'?'カメラが許可されていません。矢印の体験はこのまま使えます。':error.name==='NotFoundError'?'カメラが見つかりません。矢印の体験はこのまま使えます。':'カメラを開けませんでした。Safariなどのブラウザで開いて再試行できます。';
  $('cameraRetry').hidden=false;
 }
}
function openCamera(){
 cameraOrigin=document.activeElement;cameraTarget=state.detour&&state.selectedEvent?events.find(e=>e.id===state.selectedEvent).name:state.destination;cameraIndex=0;
 cameraSteps=[['まっすぐ進む',0],[cameraTarget==='カフェ'?'右に曲がる':'左に曲がる',cameraTarget==='カフェ'?90:-90],['目的地はこの先',0]];
 $('cameraDestination').textContent=cameraTarget+'へ';$('cameraPanel').hidden=false;document.body.style.overflow='hidden';
 $('app').inert=true;$('bottom').inert=true;updateCamera();updateLocationUI();$('cameraPanel').querySelector('.camera-close').focus();startCamera();
}
function updateCamera(){const [label,rotation]=cameraSteps[cameraIndex];$('cameraCaption').textContent=label;$('cameraArrow').style.transform=`rotate(${rotation}deg)`;$('cameraArrow').setAttribute('aria-label',label);$('cameraStep').textContent=`案内 ${cameraIndex+1} / ${cameraSteps.length}`;$('cameraBack').disabled=cameraIndex===0;$('cameraNext').textContent=cameraIndex===cameraSteps.length-1?'到着を体験する':'次の案内';}
function advanceCamera(delta){if(delta===1&&cameraIndex===cameraSteps.length-1){closeCamera();if(!state.detour){state.arrived=true;render();toast('到着しました。近くの寄り道を見てみましょう。');$('cameraLaunch').focus();}else toast(cameraTarget+'への到着を体験しました');return;}cameraIndex=Math.max(0,Math.min(cameraSteps.length-1,cameraIndex+delta));updateCamera();}
function closeCamera(){stopCamera();$('cameraPanel').hidden=true;document.body.style.overflow='';$('app').inert=false;$('bottom').inert=false;if(cameraOrigin?.isConnected)cameraOrigin.focus();}
$('cameraPanel').addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();closeCamera();}if(event.key==='Tab'){const buttons=[...$('cameraPanel').querySelectorAll('button')].filter(b=>!b.hidden&&!b.disabled);const first=buttons[0],last=buttons.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
window.addEventListener('pagehide',()=>{closeCamera();stopLocation();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(!$('cameraPanel').hidden)closeCamera();stopLocation();}});

render();
</script><script src="./lab.js"></script></body></html>
